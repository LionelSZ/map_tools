<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapbox Locator</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css' rel='stylesheet' />
    <script src="config.js"></script>
    <script src="i18n.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            cursor: crosshair;
        }

        .controls-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            width: 300px;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h2 {
            margin: 0 0 15px 0;
            font-size: 18px;
            color: #333;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }

        .input-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s;
            font-family: 'Inter', sans-serif;
            resize: vertical;
            min-height: 80px;
        }

        .input-group textarea:focus {
            outline: none;
            border-color: #007cbf;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        button {
            flex: 1;
            padding: 10px;
            background: #007cbf;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background: #006096;
        }

        button.secondary {
            background: #e0e0e0;
            color: #333;
        }

        button.secondary:hover {
            background: #d0d0d0;
        }

        #error-msg {
            color: #d32f2f;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }

        .info-msg {
            font-size: 11px;
            color: #666;
            margin-top: 8px;
            font-style: italic;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <div class="controls-overlay">
        <h2 id="title">Location Finder</h2>

        <div class="input-group">
            <label for="coords" id="coordsLabel">Coordinates</label>
            <textarea id="coords" placeholder=""></textarea>
            <div class="info-msg" id="clickMapTip"></div>
        </div>

        <div class="button-group">
            <button id="goBtn" onclick="locate()">Go</button>
            <button class="secondary" id="clearBtn" onclick="clearMarkers()">Clear</button>
        </div>
        <div id="error-msg"></div>
    </div>

    <script>
        let map;
        let markers = [];

        function initMap() {
            if (map) return;

            try {
                mapboxgl.accessToken = Config.MAPBOX_TOKEN;
                map = new mapboxgl.Map({
                    container: 'map',
                    style: Config.MAP_STYLE,
                    center: Config.DEFAULT_CENTER,
                    zoom: Config.DEFAULT_ZOOM
                });

                map.on('load', () => {
                    console.log("Map loaded");
                });

                map.on('error', (e) => {
                    console.error("Map error:", e);
                });

                map.on('click', (e) => {
                    const { lng, lat } = e.lngLat;

                    const marker = new mapboxgl.Marker()
                        .setLngLat([lng, lat])
                        .addTo(map);
                    markers.push(marker);

                    const coordsTextarea = document.getElementById('coords');
                    const currentCoords = coordsTextarea.value.trim();
                    const newCoord = `${lng.toFixed(6)}, ${lat.toFixed(6)}`;

                    if (currentCoords) {
                        coordsTextarea.value = currentCoords + '\n' + newCoord;
                    } else {
                        coordsTextarea.value = newCoord;
                    }
                });

            } catch (e) {
                console.error(e);
            }
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error-msg').style.display = 'none';
        }

        function locate() {
            hideError();
            const coordsText = document.getElementById('coords').value.trim();

            if (!coordsText) {
                showError(i18n.t('errorEnterCoords'));
                return;
            }

            const lines = coordsText.split('\n');
            const coordinates = [];

            for (let line of lines) {
                line = line.trim();
                if (!line) continue;

                const parts = line.split(',').map(p => p.trim());
                if (parts.length !== 2) {
                    showError(`${i18n.t('errorInvalidFormat')}: "${line}". ${i18n.t('formatHint')}`);
                    return;
                }

                const lng = parseFloat(parts[0]);
                const lat = parseFloat(parts[1]);

                if (isNaN(lng) || isNaN(lat)) {
                    showError(`${i18n.t('errorInvalidCoords')}: "${line}"`);
                    return;
                }

                coordinates.push([lng, lat]);
            }

            if (coordinates.length === 0) {
                showError(i18n.t('errorNoValidCoords'));
                return;
            }

            if (!map) {
                initMap();
            }

            if (!mapboxgl.supported()) {
                showError(i18n.t('errorBrowserNotSupported'));
                return;
            }

            try {
                clearMarkers();

                coordinates.forEach((coord) => {
                    const marker = new mapboxgl.Marker()
                        .setLngLat(coord)
                        .addTo(map);
                    markers.push(marker);
                });

                if (coordinates.length === 1) {
                    map.flyTo({
                        center: coordinates[0],
                        zoom: 12,
                        essential: true
                    });
                } else {
                    const bounds = new mapboxgl.LngLatBounds();
                    coordinates.forEach(coord => bounds.extend(coord));
                    map.fitBounds(bounds, {
                        padding: 50,
                        maxZoom: 15,
                        essential: true
                    });
                }
            } catch (e) {
                showError(i18n.t('errorDisplayingMarkers'));
                console.error(e);
            }
        }

        function clearMarkers() {
            markers.forEach(marker => marker.remove());
            markers = [];
            document.getElementById('coords').value = '';
        }

        function updateUI() {
            document.getElementById('title').textContent = i18n.t('locationFinder');
            document.getElementById('coordsLabel').textContent = i18n.t('coordinates');
            document.getElementById('coords').placeholder = i18n.t('coordsPlaceholder');
            document.getElementById('clickMapTip').textContent = i18n.t('clickMapTip');
            document.getElementById('goBtn').textContent = i18n.t('goButton');
            document.getElementById('clearBtn').textContent = i18n.t('clearButton');
        }

        window.addEventListener('load', () => {
            updateUI();
            initMap();
        });
    </script>

</body>

</html>
