<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoJSON Viewer</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css' rel='stylesheet' />
    <script src="config.js"></script>
    <script src="i18n.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        .controls-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            width: 320px;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.5);
            max-height: 80vh;
            overflow-y: auto;
        }

        h2 {
            margin: 0 0 15px 0;
            font-size: 18px;
            color: #333;
        }

        .upload-area {
            border: 2px dashed #007cbf;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        .upload-area:hover {
            background: #e6f4fa;
            border-color: #0066a1;
        }

        .upload-area.dragover {
            background: #d4edfa;
            border-color: #0066a1;
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .upload-text {
            font-size: 14px;
            color: #666;
        }

        .upload-text strong {
            display: block;
            margin-bottom: 5px;
        }

        input[type="file"] {
            display: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007cbf;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background: #006096;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #error-msg {
            color: #d32f2f;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }

        .properties-panel {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
            display: none;
        }

        .properties-panel h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #333;
        }

        .property-item {
            display: flex;
            padding: 6px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .property-key {
            font-weight: 600;
            color: #555;
            margin-right: 8px;
            min-width: 100px;
            font-size: 12px;
        }

        .property-value {
            color: #666;
            flex: 1;
            word-break: break-word;
            font-size: 12px;
        }

        .feature-type {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .type-point {
            background: #e3f2fd;
            color: #1976d2;
        }

        .type-line {
            background: #fff3e0;
            color: #f57c00;
        }

        .type-polygon {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .stats {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            font-size: 12px;
            color: #666;
        }

        .stats-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
        }

        .info-msg {
            font-size: 11px;
            color: #666;
            margin-top: 8px;
            font-style: italic;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <div class="controls-overlay">
        <h2 id="title">GeoJSON Viewer</h2>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">
                <strong id="uploadTitle">Upload GeoJSON</strong>
                <small id="uploadSubtitle">Supports .geojson and .json files</small>
            </div>
            <input type="file" id="fileInput" accept=".geojson,.json">
        </div>

        <button id="clearBtn" onclick="clearGeoJSON()" disabled>Clear</button>

        <div class="stats" id="statsPanel" style="display: none;">
            <div class="stats-item">
                <span id="totalFeaturesLabel">Total Features:</span>
                <strong id="featureCount">0</strong>
            </div>
        </div>

        <div id="error-msg"></div>

        <div class="properties-panel" id="propertiesPanel">
            <h3 id="propertiesTitle">Feature Properties</h3>
            <div id="featureType"></div>
            <div id="propertiesList"></div>
        </div>
    </div>

    <script>
        let map;
        let currentGeoJSON = null;

        function initMap() {
            mapboxgl.accessToken = Config.MAPBOX_TOKEN;
            map = new mapboxgl.Map({
                container: 'map',
                style: Config.MAP_STYLE,
                center: Config.DEFAULT_CENTER,
                zoom: Config.DEFAULT_ZOOM
            });

            map.on('load', () => {
                map.on('click', 'geojson-fill', showFeatureProperties);
                map.on('click', 'geojson-line', showFeatureProperties);
                map.on('click', 'geojson-points', showFeatureProperties);

                map.on('mouseenter', 'geojson-fill', () => { map.getCanvas().style.cursor = 'pointer'; });
                map.on('mouseleave', 'geojson-fill', () => { map.getCanvas().style.cursor = ''; });
                map.on('mouseenter', 'geojson-line', () => { map.getCanvas().style.cursor = 'pointer'; });
                map.on('mouseleave', 'geojson-line', () => { map.getCanvas().style.cursor = ''; });
                map.on('mouseenter', 'geojson-points', () => { map.getCanvas().style.cursor = 'pointer'; });
                map.on('mouseleave', 'geojson-points', () => { map.getCanvas().style.cursor = ''; });
            });
        }

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        function handleFile(file) {
            if (!file.name.endsWith('.geojson') && !file.name.endsWith('.json')) {
                showError(i18n.t('errorInvalidFile'));
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const geojson = JSON.parse(e.target.result);
                    loadGeoJSON(geojson);
                    hideError();
                } catch (err) {
                    showError(i18n.t('errorInvalidGeoJSON') + ': ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function loadGeoJSON(geojson) {
            if (!map.loaded()) {
                showError(i18n.t('errorMapLoading'));
                return;
            }

            currentGeoJSON = geojson;

            if (map.getLayer('geojson-fill')) map.removeLayer('geojson-fill');
            if (map.getLayer('geojson-line')) map.removeLayer('geojson-line');
            if (map.getLayer('geojson-points')) map.removeLayer('geojson-points');
            if (map.getSource('geojson')) map.removeSource('geojson');

            map.addSource('geojson', {
                type: 'geojson',
                data: geojson
            });

            map.addLayer({
                id: 'geojson-fill',
                type: 'fill',
                source: 'geojson',
                filter: ['==', '$type', 'Polygon'],
                paint: {
                    'fill-color': '#7b1fa2',
                    'fill-opacity': 0.3
                }
            });

            map.addLayer({
                id: 'geojson-line',
                type: 'line',
                source: 'geojson',
                filter: ['in', '$type', 'LineString', 'Polygon'],
                paint: {
                    'line-color': '#f57c00',
                    'line-width': 2
                }
            });

            map.addLayer({
                id: 'geojson-points',
                type: 'circle',
                source: 'geojson',
                filter: ['==', '$type', 'Point'],
                paint: {
                    'circle-radius': 6,
                    'circle-color': '#1976d2',
                    'circle-stroke-width': 2,
                    'circle-stroke-color': '#ffffff'
                }
            });

            const bounds = new mapboxgl.LngLatBounds();
            const features = geojson.features || [geojson];

            features.forEach(feature => {
                if (feature.geometry.type === 'Point') {
                    bounds.extend(feature.geometry.coordinates);
                } else if (feature.geometry.type === 'LineString') {
                    feature.geometry.coordinates.forEach(coord => bounds.extend(coord));
                } else if (feature.geometry.type === 'Polygon') {
                    feature.geometry.coordinates[0].forEach(coord => bounds.extend(coord));
                } else if (feature.geometry.type === 'MultiPoint') {
                    feature.geometry.coordinates.forEach(coord => bounds.extend(coord));
                } else if (feature.geometry.type === 'MultiLineString') {
                    feature.geometry.coordinates.forEach(line => {
                        line.forEach(coord => bounds.extend(coord));
                    });
                } else if (feature.geometry.type === 'MultiPolygon') {
                    feature.geometry.coordinates.forEach(polygon => {
                        polygon[0].forEach(coord => bounds.extend(coord));
                    });
                }
            });

            if (!bounds.isEmpty()) {
                map.fitBounds(bounds, { padding: 50, maxZoom: 15 });
            }

            document.getElementById('clearBtn').disabled = false;
            document.getElementById('statsPanel').style.display = 'block';
            document.getElementById('featureCount').textContent = features.length;
        }

        function showFeatureProperties(e) {
            if (e.features.length === 0) return;

            const feature = e.features[0];
            const panel = document.getElementById('propertiesPanel');
            const typeDiv = document.getElementById('featureType');
            const propertiesList = document.getElementById('propertiesList');

            const geomType = feature.geometry.type;
            let typeClass = 'type-point';
            let typeText = i18n.t('geometryPoint');

            if (geomType.includes('Line')) {
                typeClass = 'type-line';
                typeText = i18n.t('geometry' + geomType);
            }
            if (geomType.includes('Polygon')) {
                typeClass = 'type-polygon';
                typeText = i18n.t('geometry' + geomType);
            }
            if (geomType === 'Point') {
                typeText = i18n.t('geometryPoint');
            }

            typeDiv.innerHTML = `<span class="feature-type ${typeClass}">${typeText}</span>`;

            propertiesList.innerHTML = '';
            const props = feature.properties || {};

            if (Object.keys(props).length === 0) {
                propertiesList.innerHTML = `<div class="info-msg">${i18n.t('noProperties')}</div>`;
            } else {
                for (const [key, value] of Object.entries(props)) {
                    const item = document.createElement('div');
                    item.className = 'property-item';
                    item.innerHTML = `
                        <div class="property-key">${key}:</div>
                        <div class="property-value">${value}</div>
                    `;
                    propertiesList.appendChild(item);
                }
            }

            panel.style.display = 'block';
        }

        function clearGeoJSON() {
            if (map.getLayer('geojson-fill')) map.removeLayer('geojson-fill');
            if (map.getLayer('geojson-line')) map.removeLayer('geojson-line');
            if (map.getLayer('geojson-points')) map.removeLayer('geojson-points');
            if (map.getSource('geojson')) map.removeSource('geojson');

            currentGeoJSON = null;
            document.getElementById('clearBtn').disabled = true;
            document.getElementById('statsPanel').style.display = 'none';
            document.getElementById('propertiesPanel').style.display = 'none';
            document.getElementById('fileInput').value = '';

            map.flyTo({ center: Config.DEFAULT_CENTER, zoom: Config.DEFAULT_ZOOM });
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error-msg').style.display = 'none';
        }

        function updateUI() {
            document.getElementById('title').textContent = i18n.t('geojsonViewerTitle');
            document.getElementById('uploadTitle').textContent = i18n.t('uploadAreaTitle');
            document.getElementById('uploadSubtitle').textContent = i18n.t('uploadAreaSubtitle');
            document.getElementById('clearBtn').textContent = i18n.t('clearButton');
            document.getElementById('totalFeaturesLabel').textContent = i18n.t('totalFeatures');
            document.getElementById('propertiesTitle').textContent = i18n.t('featureProperties');
        }

        window.addEventListener('load', () => {
            updateUI();
            initMap();
        });
    </script>

</body>

</html>
